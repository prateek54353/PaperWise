name: Full Release (Android APK + iOS IPA)

on:
  push:
    tags:
      - 'v*'

jobs:
  version-sync:
    name: Sync version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          # Extract version from tag (e.g., v2.2.0 -> 2.2.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update pubspec.yaml with tag version
        run: |
          # Get current build number and increment it
          BUILD_NUM=$(grep 'version:' pubspec.yaml | sed 's/.*+\([0-9]*\)/\1/')
          NEW_BUILD_NUM=$((BUILD_NUM + 1))
          NEW_VERSION="${{ steps.extract_version.outputs.version }}+${NEW_BUILD_NUM}"
          
          # Update pubspec.yaml
          sed -i "s/version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo "Updated pubspec.yaml to: $NEW_VERSION"

      - name: Generate local.properties
        run: |
          VERSION_NAME=${{ steps.extract_version.outputs.version }}
          BUILD_NUM=$(grep 'version:' pubspec.yaml | sed 's/.*+\([0-9]*\)/\1/')
          
          mkdir -p android
          cat > android/local.properties << EOF
flutter.versionName=$VERSION_NAME
flutter.versionCode=$BUILD_NUM
EOF
          echo "Generated android/local.properties"

      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml android/local.properties
          git commit -m "chore: bump version to ${{ steps.extract_version.outputs.version }} [skip ci]"
          git push

  build-android:
    name: Build Android APKs
    needs: version-sync
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Create Keystore File
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks
          echo "✓ Keystore file created"

      - name: Verify Keystore File
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          if [ -f android/app/release-keystore.jks ]; then
            echo "✓ Keystore file exists"
            ls -lh android/app/release-keystore.jks
          else
            echo "✗ Keystore file not found"
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: release-keystore.jks

      - name: Verify APK Signing
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "Verifying APK signing..."
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            if [ -f "$apk" ]; then
              echo "📦 Found APK: $apk"
              # Use apksigner to verify signing (available in Android SDK)
              if command -v apksigner &> /dev/null; then
                apksigner verify --print-certs "$apk" || echo "⚠ APK signing verification failed"
              else
                echo "⚠ apksigner not available, skipping verification"
              fi
            fi
          done

      - name: Upload APKs to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-*-release.apk
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          draft: true

  build-ios:
    name: Build iOS unsigned IPA
    needs: version-sync
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: ios

      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          mkdir -p build/ios/ipa
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/Runner.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" build/ios/ipa/Paperwise-unsigned-${{ needs.version-sync.outputs.version }}.ipa

      - name: Upload unsigned IPA to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/ipa/Paperwise-unsigned-${{ needs.version-sync.outputs.version }}.ipa
          tag: ${{ github.ref }}
          overwrite: true
          draft: true
