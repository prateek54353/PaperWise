name: Publish Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v2.5.4)
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android split APKs
    runs-on: ubuntu-latest

    outputs:
      succeeded: ${{ steps.result.outputs.succeeded }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Build signed split APKs
        id: build
        continue-on-error: true
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      - name: Record Android result
        id: result
        if: always()
        run: |
          echo "succeeded=${{ steps.build.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

      - name: List generated APKs
        if: always() && steps.build.outcome == 'success'
        run: |
          ls -lah build/app/outputs/flutter-apk/

      - name: Upload split APKs
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  ios:
    name: Unsigned IPA
    runs-on: macos-latest

    outputs:
      succeeded: ${{ steps.result.outputs.succeeded }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        id: build
        continue-on-error: true
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign

          mkdir -p build/ios/ipa
          mkdir -p build/ios/iphoneos/Payload

          rm -rf build/ios/iphoneos/Payload/Runner.app

          mv build/ios/iphoneos/Runner.app \
            build/ios/iphoneos/Payload/

          cd build/ios/iphoneos

          zip -qry \
            ../ipa/PaperWise-unsigned.ipa \
            Payload

      - name: Record iOS result
        id: result
        if: always()
        run: |
          echo "succeeded=${{ steps.build.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

      - name: List generated IPA
        if: always() && steps.build.outcome == 'success'
        run: |
          ls -lah build/ios/ipa/

      - name: Upload unsigned IPA
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub release

    needs:
      - android
      - ios

    if: >-
      always() &&
      (
        needs.android.outputs.succeeded == 'true' ||
        needs.ios.outputs.succeeded == 'true'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          find release-assets -type f -maxdepth 2 -print

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -e

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --generate-notes \
              --title "$TAG"
          fi

          gh release upload \
            "$TAG" \
            release-assets/* \
            --clobber