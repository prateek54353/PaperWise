name: Build unsigned iOS artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version-sync:
    name: Sync version from tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: |
          # Extract version from tag (e.g., v2.2.0 -> 2.2.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update pubspec.yaml with tag version
        run: |
          # Get current build number and increment it
          BUILD_NUM=$(grep 'version:' pubspec.yaml | sed 's/.*+\([0-9]*\)/\1/')
          NEW_BUILD_NUM=$((BUILD_NUM + 1))
          NEW_VERSION="${{ steps.extract_version.outputs.version }}+${NEW_BUILD_NUM}"
          
          # Update pubspec.yaml
          sed -i "s/version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo "Updated pubspec.yaml to: $NEW_VERSION"

      - name: Generate local.properties
        run: |
          VERSION_NAME=${{ steps.extract_version.outputs.version }}
          BUILD_NUM=$(grep 'version:' pubspec.yaml | sed 's/.*+\([0-9]*\)/\1/')
          
          mkdir -p android
          cat > android/local.properties << EOF
flutter.versionName=$VERSION_NAME
flutter.versionCode=$BUILD_NUM
EOF
          echo "Generated android/local.properties"

      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml android/local.properties
          git commit -m "chore: bump version to ${{ steps.extract_version.outputs.version }} [skip ci]"
          git push

  build-ios:
    name: Build unsigned iOS artifacts
    runs-on: macos-latest
    needs: version-sync
    if: always() && (needs.version-sync.result == 'success' || needs.version-sync.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: ios

      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA for inspection
        run: |
          if [ -n "${{ needs.version-sync.outputs.version }}" ]; then
            VERSION_NAME="${{ needs.version-sync.outputs.version }}"
          else
            VERSION_NAME="${{ github.sha }}"
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          mkdir -p build/ios/ipa
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/Runner.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" build/ios/ipa/Paperwise-unsigned-${VERSION_NAME}.ipa

      - name: Build simulator app
        run: flutter build ios --debug --simulator

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Paperwise-unsigned-IPA-${{ github.sha }}
          path: build/ios/ipa/Paperwise-unsigned-*.ipa
          if-no-files-found: error

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Paperwise-iOS-simulator-app-${{ github.sha }}
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
