name: Build unsigned iOS artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS artifacts
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: ios

      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA for inspection
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          mkdir -p build/ios/ipa
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/Runner.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" build/ios/ipa/Paperwise-unsigned.ipa

      - name: Build simulator app
        run: flutter build ios --debug --simulator

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Paperwise-unsigned-IPA-${{ github.sha }}
          path: build/ios/ipa/Paperwise-unsigned.ipa
          if-no-files-found: error

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Paperwise-iOS-simulator-app-${{ github.sha }}
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
